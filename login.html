<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <p class="site-name">เที่ยวบ้านเรา</p>

        <nav aria-label="เมนูหลัก">
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="places.html">ที่เที่ยว</a></li>
                <li><a href="food.html">อาหาร</a></li>
                <li><a href="plan.html">วางแผนเที่ยว</a></li>
                <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
                <li><a href="login.html" aria-current="page">เข้าสู่ระบบ</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="login-card">

            <h1>เข้าสู่ระบบ</h1>

            <p class="login-subtitle">
                ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username"
                           placeholder="กรอกชื่อผู้ใช้" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>

                    <div class="password-box">
                        <input type="password" id="password"
                               placeholder="กรอกรหัสผ่าน" required>

                        <button type="button" id="togglePassword">
                            แสดง
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">ประเภทผู้ใช้งาน</label>

                    <select id="role">
                        <option value="user">สมาชิก (User)</option>
                        <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                    </select>
                </div>

                <p id="loginMessage" role="status"></p>

                <button type="submit" class="login-button">
                    เข้าสู่ระบบ
                </button>

            </form>

            <div class="demo-account">
                <strong>บัญชีทดลองสำหรับฝึกปฏิบัติ</strong>

                <p>Admin: <strong>admin / admin123</strong></p>
                <p>User: <strong>user / user123</strong></p>
            </div>

        </section>

    </main>

    <footer>
        <p>นายยศภัทร ภมร 066 | ใบงานฝึกปฏิบัติวิชาการสร้างเว็บไซต์ทางธุรกิจ</p>
    </footer>

    <script src="login.js"></script>

</body>
</html>
